name: proven-index
# Keeps evidence/proven-launches.json up to date (SPEC 4.17, decision 39): every few hours it
# reads IMD's launch list, verifies new store launches from IMD's record and the chain, and
# commits the ones that pass. Entries already in the file are never changed or removed.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: proven-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify and index new launches
        run: python3 -I scripts/proven_index.py
      - name: Commit when the index changed
        run: |
          if git diff --quiet -- evidence/proven-launches.json evidence/proven-index-state.json; then
            echo "no change"; exit 0
          fi
          git config user.name "The Hooks Store"
          git config user.email "345667368+the-hook-store@users.noreply.github.com"
          git add evidence/proven-launches.json evidence/proven-index-state.json
          git commit -m "Proven index: scheduled run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
